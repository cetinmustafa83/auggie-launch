[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auggie-launch"
description = "9router-native launcher and Augment-compatible proxy for the Auggie CLI"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "auggie-launch contributors" }]
keywords = ["auggie", "augment", "9router", "llm", "proxy"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
auggie-launch = "auggie_launch.cli:main"

[tool.setuptools]
packages = ["auggie_launch"]

[tool.setuptools.dynamic]
version = { attr = "auggie_launch.config.__version__" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "E501",
  "B008",
  "RUF001",
]

[tool.mypy]
python_version = "3.10"
files = ["auggie_launch"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
