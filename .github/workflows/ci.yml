name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest -v test_modern_proxy test_install
      - name: CLI smoke test
        env:
          AUGGIE_LAUNCH_BASE_URL: https://api.codegpt.co/api/v1
          AUGGIE_LAUNCH_MODEL: deepseek-v4.1-flash
          AUGGIE_LAUNCH_API_KEY: ci-dummy-key
          # Keep startup deterministic: no token probing, no config warnings.
          AUGGIE_LAUNCH_CODEGPT_SESSION_URL: ""
          AUGGIE_LAUNCH_CONFIG_CHECK: "false"
        run: |
          python -m auggie_launch --help
          python -m auggie_launch --models
          python -m auggie_launch --print-env

  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - name: Ruff
        run: ruff check auggie_launch/ test_modern_proxy.py test_install.py
      - name: Mypy
        run: mypy

  build:
    name: build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
